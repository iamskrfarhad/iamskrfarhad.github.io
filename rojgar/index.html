*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
 --deep:#101312;--deep2:#1d2420;--emerald:#10b981;--emerald-d:#0a8a4c;
 --gold:#10a854;--gold2:#3ecf7f;--gold-soft:#e0f4e8;
 --bg:#f6f4ee;--card:#ffffff;--text:#12211a;--muted:#66766c;--line:#e7e3d8;
 --red:#dc2626;--red-soft:#fdecec;--amber:#b45309;--amber-soft:#fdf3e0;
 --shadow:0 6px 22px rgba(0,0,0,.09);--shadow-sm:0 2px 8px rgba(0,0,0,.07);
 --r:18px;
}
@media (prefers-color-scheme:dark){
 :root{--bg:#0a120d;--card:#14211a;--text:#e9f2ec;--muted:#93a89a;--line:#223529;--gold-soft:#0f2c1c;--red-soft:#33161a;--amber-soft:#2e2110;--shadow:0 6px 22px rgba(0,0,0,.35);--shadow-sm:0 2px 8px rgba(0,0,0,.3)}
}
body{font-family:"Hind Siliguri","Noto Sans Bengali",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);max-width:520px;margin:0 auto;padding-bottom:110px}
svg.icn{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.icn.sm{width:17px;height:17px}
header{position:relative;overflow:hidden;background:linear-gradient(140deg,#000000 0%,#101312 48%,#1d2420 100%);color:#fff;padding:22px 18px 30px;border-radius:0 0 26px 26px;box-shadow:0 10px 30px rgba(0,0,0,.30)}
header::before{content:"";position:absolute;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(16,168,84,.30),transparent 65%);top:-140px;right:-90px}
header::after{content:"৳";position:absolute;right:6px;bottom:-58px;font-size:170px;font-weight:800;color:rgba(255,255,255,.05);line-height:1}
.brand{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.logo{width:50px;height:50px;border-radius:15px;background:#ffffff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.6)}
.logo img{width:41px;height:41px;object-fit:contain}
.brand .app{font-size:27px;font-weight:800;letter-spacing:.2px;line-height:1.1}
.brand .app .dot{color:var(--gold2)}
.brand .slogan{font-size:12.5px;color:#cfe6d8;margin-top:2px}
.bizchip{position:relative;z-index:1;margin-top:18px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(4px);border-radius:14px;padding:11px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.bizchip .biz{font-size:16.5px;font-weight:700}
.bizchip .date{font-size:12px;color:#cfe6d8;text-align:right;white-space:pre-line;line-height:1.5}
main{padding:16px 14px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--shadow-sm)}
.card h3{font-size:15.5px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden}
.stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(var(--emerald),var(--deep2))}
.stat.gold::before{background:linear-gradient(var(--gold2),var(--gold))}
.stat .lbl{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.stat .val{font-size:20px;font-weight:800;margin-top:5px}
.stat .val.pos{color:var(--emerald-d)} .stat .val.neg{color:var(--red)}
@media (prefers-color-scheme:dark){.stat .val.pos{color:#34d399}}
.section-t{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.4px;margin:16px 2px 9px;text-transform:uppercase}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:4px}
.quick button{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 2px 11px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text);cursor:pointer;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;align-items:center;gap:7px}
.quick .qic{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;color:#fff}
.q1{background:linear-gradient(145deg,#10b981,#047857)} .q2{background:linear-gradient(145deg,#d97706,#b45309)} .q3{background:linear-gradient(145deg,#0ea5a4,#0f766e)} .q4{background:linear-gradient(145deg,#8b5cf6,#7c3aed)}
.banner{background:linear-gradient(120deg,#fdf3e0,#fbe9bd);color:#92400e;border:1px solid #f0d48a;border-radius:14px;padding:11px 13px;font-size:13px;font-weight:600;margin:12px 0;cursor:pointer;display:flex;gap:8px;align-items:center}
@media (prefers-color-scheme:dark){.banner{background:#2e2110;color:#fcd34d;border-color:#57451a}}
.row{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row .ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.ic.g{background:#e3f5ec;color:#047857}.ic.a{background:var(--amber-soft);color:var(--amber)}.ic.r{background:var(--red-soft);color:var(--red)}.ic.t{background:#e0f5f4;color:#0f766e}.ic.p{background:#efe9fd;color:#7c3aed}
@media (prefers-color-scheme:dark){.ic.g{background:#123528;color:#34d399}.ic.t{background:#0e2e2c;color:#2dd4bf}.ic.p{background:#241a3f;color:#a78bfa}}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12px;color:var(--muted);margin-top:1px}
.row .amt{font-weight:800;font-size:14px}
.amt.pos{color:var(--emerald-d)} .amt.neg{color:var(--red)}
@media (prefers-color-scheme:dark){.amt.pos{color:#34d399}}
.empty{text-align:center;color:var(--muted);padding:26px 12px;font-size:14px;line-height:1.8}
.empty .eic{width:56px;height:56px;border-radius:50%;background:var(--gold-soft);color:var(--gold);display:flex;align-items:center;justify-content:center;margin:0 auto 10px}
.btn{display:inline-flex;align-items:center;gap:7px;background:linear-gradient(145deg,var(--emerald-d),var(--deep2));color:#fff;border:none;border-radius:12px;padding:11px 16px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 4px 12px rgba(5,150,105,.3);text-decoration:none}
.btn.ghost{background:var(--card);color:var(--text);border:1px solid var(--line);box-shadow:none}
.btn.small{padding:8px 12px;font-size:13px;border-radius:10px}
.btn.red{background:linear-gradient(145deg,#ef4444,#b91c1c);box-shadow:0 4px 12px rgba(220,38,38,.25)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.addbar{margin-bottom:12px}
.addbar .btn{width:100%;justify-content:center;padding:13px}
.chip{display:inline-flex;align-items:center;background:#e3f5ec;color:#047857;font-size:11px;font-weight:700;border-radius:20px;padding:3px 10px}
@media (prefers-color-scheme:dark){.chip{background:#123528;color:#34d399}}
.chip.due{background:var(--red-soft);color:var(--red)}
.warn{color:var(--red);font-weight:700}
.search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:13px;background:var(--card);color:var(--text);font-family:inherit;font-size:14px;margin-bottom:12px;box-shadow:var(--shadow-sm)}
.search:focus{outline:2px solid var(--gold);border-color:transparent}
nav{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:calc(100% - 20px);max-width:500px;background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:0 12px 32px rgba(0,0,0,.20);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 6px;z-index:40}
nav button{background:none;border:none;font-family:inherit;font-size:11.5px;color:var(--muted);cursor:pointer;padding:7px 0 5px;border-radius:15px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button.on{color:var(--deep);background:linear-gradient(145deg,#e3f5ec,#d3efe0);font-weight:800}
@media (prefers-color-scheme:dark){nav button.on{color:#34d399;background:#123528}}
.sheetwrap{position:fixed;inset:0;background:rgba(4,20,13,.55);z-index:60;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
.sheetwrap.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:10px 18px 20px;box-shadow:0 -12px 40px rgba(0,0,0,.25)}
.sheet::before{content:"";display:block;width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 14px}
.sheet h3{font-size:17px;font-weight:800;margin-bottom:12px}
.f{margin-bottom:12px}
.f label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:600}
.f input,.f select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text);font-family:inherit;font-size:15px}
.f input:focus,.f select:focus{outline:2px solid var(--gold);border-color:transparent}
.err{color:var(--red);font-size:13px;min-height:18px;margin-bottom:6px;font-weight:600}
.credit{text-align:center;color:var(--muted);font-size:13px;line-height:1.9;padding:10px 0 4px}
.credit .heart{color:var(--red)}
.page{display:none}.page.on{display:block}
.kv{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:none}.kv b{font-weight:800}
.totalbar{background:linear-gradient(140deg,var(--deep),var(--deep2));color:#fff;border-radius:var(--r);padding:15px 16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.totalbar .tl{font-size:13px;color:#cfe6d8}
.totalbar .tv{font-size:21px;font-weight:800}
.note{font-size:13px;color:var(--muted);line-height:1.75}
</style>
</head>

function blank(){return {bizName:"আমার ব্যবসা",products:[],sales:[],dues:[],payments:[],purchases:[],expenses:[]};}
function load(){try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);return Object.assign(blank(),d);}}catch(e){}return blank();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function bn(n){return String(n).replace(/[0-9]/g,c=>BND[+c]);}
function en(s){return String(s==null?"":s).replace(/[০-৯]/g,c=>BND.indexOf(c));}
function num(v){const n=parseFloat(en(v));return isNaN(n)?0:n;}
function money(n){const neg=n<0;let s=String(Math.abs(Math.round(n)));if(s.length>3){const last=s.slice(-3);let rest=s.slice(0,-3);rest=rest.replace(/\B(?=(\d{2})+(?!\d))/g,",");s=rest+","+last;}return (neg?"−":"")+"৳"+bn(s);}
function dstr(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function today(){return dstr(new Date());}
function fmtDate(iso){if(!iso)return "";const p=iso.split("-");return bn(+p[2])+" "+MONTHS[+p[1]-1]+" "+bn(p[0]);}
function thisMonth(){return today().slice(0,7);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function prod(id){return DB.products.find(p=>p.id===id);}
let tab="home";
document.getElementById("tabbar").addEventListener("click",e=>{const b=e.target.closest("button[data-tab]");if(!b)return;tab=b.dataset.tab;render();});
function greet(){const h=new Date().getHours();if(h>=4&&h<12)return "শুভ সকাল";if(h>=12&&h<16)return "শুভ দুপুর";if(h>=16&&h<19)return "শুভ বিকেল";return "শুভ সন্ধ্যা";}

function sheetHead(t){return '<h3>'+t+'</h3><div class="err" id="ferr"></div>';}
function ferr(m){document.getElementById("ferr").textContent=m;}
function gv(id){const el=document.getElementById(id);return el?el.value.trim():"";}

    +'<div class="f"><label>পরিমাণ</label><input id="sQty" inputmode="decimal" value="১"></div>'

    +'<div class="btnrow"><button class="btn" onclick="saveSale()">সেভ করুন</button><button class="btn ghost" onclick="closeSheet()">বাতিল</button></div>');
  if(preId)saleProdChange();

function saleProdChange(){const p=prod(gv("sProd"));if(p){document.getElementById("sDesc").value=p.name;document.getElementById("sPrice").value=bn(p.sell);}}
function salePayChange(){document.getElementById("bakiBox").style.display=gv("sPay")==="baki"?"block":"none";}
function saveSale(){
  const p=prod(gv("sProd"));const qty=num(gv("sQty"))||1;const price=num(gv("sPrice"));
  const desc=gv("sDesc")||(p?p.name:"");
  if(!desc)return ferr("কী বিক্রি হলো লিখুন।");
  if(price<=0)return ferr("দাম লিখুন।");
  if(p&&qty>p.qty)return ferr("স্টকে এত পণ্য নেই। স্টক আছে "+bn(p.qty)+"টি।");
  const pay=gv("sPay");const total=Math.round(qty*price);
  if(pay==="baki"&&!gv("sCust"))return ferr("বাকি হলে ক্রেতার নাম লিখুন।");
  const sale={id:uid(),date:today(),desc:desc,productId:p?p.id:"",qty:qty,total:total,cost:p?Math.round(p.buy*qty):0,pay:pay,customer:gv("sCust"),phone:gv("sPhone")};
  DB.sales.push(sale);
  if(p)p.qty-=qty;
  if(pay==="baki")DB.dues.push({id:uid(),date:today(),customer:gv("sCust"),phone:gv("sPhone"),amount:total,paid:0,note:desc});
  save();closeSheet();tab="sales";render();
}

function saveDue(){
  const amt=num(gv("dAmt"));
  if(!gv("dCust"))return ferr("ক্রেতার নাম লিখুন।");
  if(amt<=0)return ferr("বাকির পরিমাণ লিখুন।");
  DB.dues.push({id:uid(),date:today(),customer:gv("dCust"),phone:gv("dPhone"),amount:amt,paid:0,note:gv("dNote")});
  save();closeSheet();tab="dues";render();
}
function openPay(name){
  openSheet(sheetHead("পরিশোধ নিন — "+esc(name))
    +'<div class="f"><label>কত টাকা দিলেন (৳)</label><input id="pAmt" inputmode="decimal" placeholder="0"></div>'
    +'<div class="btnrow"><button class="btn" onclick="savePay(\''+esc(name).replace(/'/g,"\\'")+'\')">সেভ করুন</button><button class="btn ghost" onclick="closeSheet()">বাতিল</button></div>');
}
function savePay(name){
  let amt=num(gv("pAmt"));
  if(amt<=0)return ferr("পরিমাণ লিখুন।");
  const items=DB.dues.filter(d=>d.customer.trim().toLowerCase()===name.trim().toLowerCase()&&(d.amount-d.paid)>0).sort((a,b)=>a.date.localeCompare(b.date));
  for(const d of items){if(amt<=0)break;const take=Math.min(amt,d.amount-d.paid);d.paid+=take;amt-=take;}
  DB.payments.push({id:uid(),date:today(),customer:name,amount:num(gv("pAmt"))});
  save();closeSheet();tab="dues";render();
}
function openProduct(id){
  const p=id?prod(id):null;
  openSheet(sheetHead(p?"পণ্য বদলান":"নতুন পণ্য")
    +'<div class="f"><label>পণ্যের নাম</label><input id="prName" value="'+(p?esc(p.name):"")+'" placeholder="যেমন: মিনিকেট চাল"></div>'
    +'<div class="f"><label>কেনা দাম (৳)</label><input id="prBuy" inputmode="decimal" value="'+(p?bn(p.buy):"")+'" placeholder="0"></div>'
    +'<div class="f"><label>বিক্রির দাম (৳)</label><input id="prSell" inputmode="decimal" value="'+(p?bn(p.sell):"")+'" placeholder="0"></div>'
    +(p?"":'<div class="f"><label>শুরুর স্টক (কতটি আছে)</label><input id="prQty" inputmode="decimal" value="০"></div>')
    +'<div class="f"><label>স্টক এর নিচে নামলে সতর্ক করবে</label><input id="prLow" inputmode="decimal" value="'+(p?bn(p.low||5):"৫")+'"></div>'
    +'<div class="btnrow"><button class="btn" onclick="saveProduct(\''+(id||"")+'\')">সেভ করুন</button><button class="btn ghost" onclick="closeSheet()">বাতিল</button></div>');
}
function saveProduct(id){
  const name=gv("prName"),buy=num(gv("prBuy")),sell=num(gv("prSell")),low=num(gv("prLow"));
  if(!name)return ferr("পণ্যের নাম লিখুন।");
  if(sell<=0)return ferr("বিক্রির দাম লিখুন।");
  if(id){const p=prod(id);p.name=name;p.buy=buy;p.sell=sell;p.low=low||5;}
  else DB.products.push({id:uid(),name:name,buy:buy,sell:sell,qty:num(gv("prQty")),low:low||5});
  save();closeSheet();tab="stock";render();
}
function delProduct(id){if(!confirm("এই পণ্যটি মুছে ফেলবেন?"))return;DB.products=DB.products.filter(p=>p.id!==id);save();render();}
function openPurchase(id){
  const p=prod(id);if(!p)return;
  openSheet(sheetHead("মাল কিনুন — "+esc(p.name))
    +'<div class="f"><label>কতটি কিনলেন</label><input id="puQty" inputmode="decimal" value="১"></div>'
    +'<div class="f"><label>একটির কেনা দাম (৳)</label><input id="puCost" inputmode="decimal" value="'+bn(p.buy)+'"></div>'
    +'<div class="btnrow"><button class="btn" onclick="savePurchase(\''+id+'\')">সেভ করুন</button><button class="btn ghost" onclick="closeSheet()">বাতিল</button></div>');
}
function savePurchase(id){
  const p=prod(id);const qty=num(gv("puQty")),cost=num(gv("puCost"));
  if(qty<=0)return ferr("পরিমাণ লিখুন।");
  if(cost<=0)return ferr("কেনা দাম লিখুন।");
  p.qty+=qty;p.buy=cost;
  DB.purchases.push({id:uid(),date:today(),productId:id,name:p.name,qty:qty,cost:Math.round(qty*cost)});
  save();closeSheet();tab="stock";render();
}
function openExpense(){
  const opts=EXCATS.map(c=>'<option>'+c+'</option>').join("");
  openSheet(sheetHead("খরচ যোগ")
    +'<div class="f"><label>খরচের ধরন</label><select id="eCat">'+opts+'</select></div>'
    +'<div class="f"><label>বিবরণ</label><input id="eDesc" placeholder="কিসের খরচ"></div>'
    +'<div class="f"><label>পরিমাণ (৳)</label><input id="eAmt" inputmode="decimal" placeholder="0"></div>'
    +'<div class="btnrow"><button class="btn" onclick="saveExpense()">সেভ করুন</button><button class="btn ghost" onclick="closeSheet()">বাতিল</button></div>');
}
function saveExpense(){
  const amt=num(gv("eAmt"));
  if(amt<=0)return ferr("খরচের পরিমাণ লিখুন।");
  DB.expenses.push({id:uid(),date:today(),cat:gv("eCat"),desc:gv("eDesc"),amount:amt});
  save();closeSheet();render();
}
function openBiz(){
  openSheet(sheetHead("ব্যবসার নাম")
    +'<div class="f"><label>নাম</label><input id="bName" value="'+esc(DB.bizName||"")+'"></div>'
    +'<div class="btnrow"><button class="btn" onclick="saveBiz()">সেভ করুন</button><button class="btn ghost" onclick="closeSheet()">বাতিল</button></div>');
}
function saveBiz(){DB.bizName=gv("bName")||"আমার ব্যবসা";save();closeSheet();render();}
function doBackup(){
  const blob=new Blob([JSON.stringify(DB,null,1)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="rojgar-backup-"+today()+".json";document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
document.getElementById("restoreFile").addEventListener("change",function(){
  const f=this.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);DB=Object.assign(blank(),d);save();render();alert("রিস্টোর হয়ে গেছে।");}catch(e){alert("ফাইলটি পড়া যায়নি। সঠিক ব্যাকআপ ফাইল দিন।");}};
  r.readAsText(f);this.value="";
});
render();
</script>
</body>
</html>
