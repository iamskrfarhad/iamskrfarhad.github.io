<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
 --deep:#22339e;--deep2:#3348c5;--emerald:#10b981;--emerald-d:#0a8a4c;
 --gold:#4b66f4;--gold2:#82dfe4;--gold-soft:#e3e9ff;
 --bg:#f6f4ee;--card:#ffffff;--text:#12211a;--muted:#66766c;--line:#e7e3d8;
 --red:#dc2626;--red-soft:#fdecec;--amber:#b45309;--amber-soft:#fdf3e0;
 --shadow:0 6px 22px rgba(0,0,0,.09);--shadow-sm:0 2px 8px rgba(0,0,0,.07);
 --r:18px;
}
html[data-theme="dark"]{--bg:#0a120d;--card:#14211a;--text:#e9f2ec;--muted:#93a89a;--line:#223529;--gold-soft:#1b2650;--red-soft:#33161a;--amber-soft:#2e2110;--shadow:0 6px 22px rgba(0,0,0,.35);--shadow-sm:0 2px 8px rgba(0,0,0,.3)}
body{font-family:"Hind Siliguri","Noto Sans Bengali",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);max-width:520px;margin:0 auto;padding-bottom:110px}
svg.icn{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.icn.sm{width:17px;height:17px}
header{position:relative;overflow:hidden;background:linear-gradient(140deg,#1e2f9e 0%,#3348c5 48%,#4b66f4 100%);color:#fff;padding:22px 18px 30px;border-radius:0 0 26px 26px;box-shadow:0 10px 30px rgba(0,0,0,.30)}
header::before{content:"";position:absolute;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(130,223,228,.45),transparent 65%);top:-140px;right:-90px}
header::after{content:"৳";position:absolute;right:6px;bottom:-58px;font-size:170px;font-weight:800;color:rgba(255,255,255,.05);line-height:1}
.brand{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.logo{width:50px;height:50px;border-radius:15px;background:#ffffff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.6)}
.logo img{width:41px;height:41px;object-fit:contain}
.brand .app{font-size:27px;font-weight:800;letter-spacing:.2px;line-height:1.1}
.brand .app .dot{color:var(--gold2)}
.brand .slogan{font-size:12.5px;color:#d7e3ff;margin-top:2px}
.bizchip{position:relative;z-index:1;margin-top:18px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(4px);border-radius:14px;padding:11px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.bizchip .biz{font-size:16.5px;font-weight:700}
.bizchip .date{font-size:12px;color:#d7e3ff;text-align:right;white-space:pre-line;line-height:1.5}
main{padding:16px 14px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--shadow-sm)}
.card h3{font-size:15.5px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden}
.stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(var(--emerald),var(--deep2))}
.stat.gold::before{background:linear-gradient(var(--gold2),var(--gold))}
.stat .lbl{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.stat .val{font-size:20px;font-weight:800;margin-top:5px}
.stat .val.pos{color:var(--emerald-d)} .stat .val.neg{color:var(--red)}
html[data-theme="dark"] .stat .val.pos{color:#34d399}
.section-t{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.4px;margin:16px 2px 9px;text-transform:uppercase}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:4px}
.quick button{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 2px 11px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text);cursor:pointer;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;align-items:center;gap:7px}
.quick .qic{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;color:#fff}
.q1{background:linear-gradient(145deg,#4b66f4,#3348c5)} .q2{background:linear-gradient(145deg,#d97706,#b45309)} .q3{background:linear-gradient(145deg,#0ea5a4,#0f766e)} .q4{background:linear-gradient(145deg,#8b5cf6,#7c3aed)}
.banner{background:linear-gradient(120deg,#fdf3e0,#fbe9bd);color:#92400e;border:1px solid #f0d48a;border-radius:14px;padding:11px 13px;font-size:13px;font-weight:600;margin:12px 0;cursor:pointer;display:flex;gap:8px;align-items:center}
html[data-theme="dark"] .banner{background:#2e2110;color:#fcd34d;border-color:#57451a}
.row{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row .ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.ic.g{background:#e3f5ec;color:#047857}.ic.a{background:var(--amber-soft);color:var(--amber)}.ic.r{background:var(--red-soft);color:var(--red)}.ic.t{background:#e0f5f4;color:#0f766e}.ic.p{background:#efe9fd;color:#7c3aed}
html[data-theme="dark"] .ic.g{background:#123528;color:#34d399}
html[data-theme="dark"] .ic.t{background:#0e2e2c;color:#2dd4bf}
html[data-theme="dark"] .ic.p{background:#241a3f;color:#a78bfa}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12px;color:var(--muted);margin-top:1px}
.row .amt{font-weight:800;font-size:14px}
.amt.pos{color:var(--emerald-d)} .amt.neg{color:var(--red)}
html[data-theme="dark"] .amt.pos{color:#34d399}
.empty{text-align:center;color:var(--muted);padding:26px 12px;font-size:14px;line-height:1.8}
.empty .eic{width:56px;height:56px;border-radius:50%;background:var(--gold-soft);color:var(--gold);display:flex;align-items:center;justify-content:center;margin:0 auto 10px}
.btn{display:inline-flex;align-items:center;gap:7px;background:linear-gradient(145deg,#3348c5,#4b66f4);color:#fff;border:none;border-radius:12px;padding:11px 16px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 4px 12px rgba(75,102,244,.35);text-decoration:none}
.btn.ghost{background:var(--card);color:var(--text);border:1px solid var(--line);box-shadow:none}
.btn.small{padding:8px 12px;font-size:13px;border-radius:10px}
.btn.red{background:linear-gradient(145deg,#ef4444,#b91c1c);box-shadow:0 4px 12px rgba(220,38,38,.25)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.addbar{margin-bottom:12px}
.addbar .btn{width:100%;justify-content:center;padding:13px}
.chip{display:inline-flex;align-items:center;background:#e3f5ec;color:#047857;font-size:11px;font-weight:700;border-radius:20px;padding:3px 10px}
html[data-theme="dark"] .chip{background:#1b2650;color:#9db4ff}
.chip.due{background:var(--red-soft);color:var(--red)}
.warn{color:var(--red);font-weight:700}
.search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:13px;background:var(--card);color:var(--text);font-family:inherit;font-size:14px;margin-bottom:12px;box-shadow:var(--shadow-sm)}
.search:focus{outline:2px solid var(--gold);border-color:transparent}
nav{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:calc(100% - 20px);max-width:500px;background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:0 12px 32px rgba(0,0,0,.20);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 6px;z-index:40}
nav button{background:none;border:none;font-family:inherit;font-size:11.5px;color:var(--muted);cursor:pointer;padding:7px 0 5px;border-radius:15px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button.on{color:var(--deep);background:linear-gradient(145deg,#e3e9ff,#d3ddff);font-weight:800}
html[data-theme="dark"] nav button.on{color:#9db4ff;background:#1b2650}
.sheetwrap{position:fixed;inset:0;background:rgba(4,20,13,.55);z-index:60;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
.sheetwrap.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:10px 18px 20px;box-shadow:0 -12px 40px rgba(0,0,0,.25)}
.sheet::before{content:"";display:block;width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 14px}
.sheet h3{font-size:17px;font-weight:800;margin-bottom:12px}
.f{margin-bottom:12px}
.f label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:600}
.f input,.f select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text);font-family:inherit;font-size:15px}
.f input:focus,.f select:focus{outline:2px solid var(--gold);border-color:transparent}
.err{color:var(--red);font-size:13px;min-height:18px;margin-bottom:6px;font-weight:600}
.credit{text-align:center;color:var(--muted);font-size:13px;line-height:1.9;padding:10px 0 4px}
.credit .heart{color:var(--red)}
.page{display:none}.page.on{display:block}
.kv{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:none}.kv b{font-weight:800}
.totalbar{background:linear-gradient(140deg,var(--deep),var(--deep2));color:#fff;border-radius:var(--r);padding:15px 16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.totalbar .tl{font-size:13px;color:#cfe6d8}
.totalbar .tv{font-size:21px;font-weight:800}
.note{font-size:13px;color:var(--muted);line-height:1.75}

.fsec{font-size:12.5px;font-weight:800;color:#2563eb;text-transform:uppercase;letter-spacing:.5px;margin:18px 0 2px}
.chiprow{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 8px}
.vchip{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border-radius:999px;border:1.5px solid var(--line,#e2e8f0);background:var(--card,#fff);color:var(--ink,#111827);font-size:13.5px;font-weight:600;cursor:pointer}
.vchip .dot{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.18);flex:none}
.selchip{display:inline-flex;align-items:center;gap:7px;padding:7px 7px 7px 12px;border-radius:999px;background:#e3eaff;color:#1e3a8a;font-size:13.5px;font-weight:700}
.selchip .dot{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.18);flex:none}
.selchip button{border:0;background:#c7d6fb;color:#1e3a8a;width:20px;height:20px;border-radius:50%;font-size:13px;line-height:1;cursor:pointer;padding:0}
html[data-theme="dark"] .selchip{background:#1a2c50;color:#cfe0ff}
html[data-theme="dark"] .selchip button{background:#2b4a7a;color:#cfe0ff}
</style>

<style id="kit-style">
:root{--bg:#f3f5ff;--line:#e6e9f7;--shadow:0 12px 32px rgba(51,72,197,.09);--shadow-sm:0 6px 18px rgba(51,72,197,.07);--r:20px}
html[data-theme="dark"]{--bg:#0b0f1e;--line:#232c4d;--shadow:0 12px 32px rgba(0,0,0,.4);--shadow-sm:0 6px 18px rgba(0,0,0,.35)}
body{background:var(--bg)}
header{background:transparent;color:var(--text);box-shadow:none;padding:18px 18px 4px;border-radius:0}
header::before,header::after{display:none}
.brand .app{color:var(--text)}
.brand .slogan{color:var(--muted)}
.logo{background:#fff;border:1px solid var(--line);box-shadow:var(--shadow-sm)}
.bizchip{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow-sm);backdrop-filter:none;margin-top:14px}
.bizchip .biz{color:var(--text)}
.bizchip .date{color:var(--muted)}
.card{border-color:var(--line);box-shadow:var(--shadow-sm);border-radius:20px}
.hero{background:linear-gradient(135deg,#22339e 0%,#3348c5 45%,#4b66f4 100%);border-radius:24px;color:#fff;padding:20px;box-shadow:0 16px 34px rgba(51,72,197,.30);margin-bottom:14px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(130,223,228,.35),transparent 65%);top:-110px;right:-60px}
.hero .hlbl{font-size:12.5px;color:#c9d6ff;letter-spacing:.3px}
.hero .hval{font-size:34px;font-weight:800;line-height:1.15;margin:4px 0 8px}
.hero .hpill{display:inline-block;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.25);color:#fff;font-size:12px;font-weight:700;border-radius:20px;padding:4px 11px}
.hero .hsub{margin-top:12px;font-size:12.5px;color:#dbe4ff;display:flex;gap:14px;flex-wrap:wrap;position:relative;z-index:1}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:6px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 10px;text-align:center;box-shadow:var(--shadow-sm)}
.kpi .kic{width:44px;height:44px;border-radius:50%;background:#e7ecff;color:#3348c5;display:flex;align-items:center;justify-content:center;margin:0 auto 8px}
html[data-theme="dark"] .kpi .kic{background:#1b2650;color:#9db4ff}
.kpi .kval{font-size:17px;font-weight:800}
.kpi .klbl{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.4}
.chart{display:flex;align-items:flex-end;gap:6px;height:130px;padding-top:16px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.chart .bar{width:70%;max-width:30px;border-radius:8px 8px 4px 4px;background:linear-gradient(180deg,#82dfe4,#4b66f4);position:relative;min-height:4px}
.chart .col.peak .bar{background:linear-gradient(180deg,#4b66f4,#22339e)}
.chart .tip{background:#e7ecff;color:#22339e;font-size:10.5px;font-weight:800;border-radius:12px;padding:2px 7px;white-space:nowrap}
html[data-theme="dark"] .chart .tip{background:#1b2650;color:#9db4ff}
.chart .dlbl{font-size:10.5px;color:var(--muted)}
.quick button{border-radius:20px;box-shadow:var(--shadow-sm)}
.quick .qic{border-radius:50%}
.q1{background:#e7ecff;color:#3348c5}.q2{background:#fdf3e0;color:#b45309}.q3{background:#e0f5f4;color:#0f766e}.q4{background:#efe9fd;color:#7c3aed}
.quick .qic svg{stroke:currentColor}
.quick button .qic{background-color:transparent}
.quick .qic.q1,.quick .qic.q2,.quick .qic.q3,.quick .qic.q4{width:44px;height:44px}
.qic.q1{background:#e7ecff!important}.qic.q2{background:#fdf3e0!important}.qic.q3{background:#e0f5f4!important}.qic.q4{background:#efe9fd!important}
nav{border-radius:24px;box-shadow:0 14px 34px rgba(51,72,197,.16)}
.btn{border-radius:999px}
.btn.small{border-radius:999px}
input.search{border-radius:999px}
.chip{border-radius:999px}
.totalbar{border-radius:24px;background:linear-gradient(135deg,#22339e,#4b66f4)}
</style>

<style id="chart-style">
.seg{display:flex;background:#ecefff;border-radius:999px;padding:4px;gap:2px;margin-bottom:6px}
html[data-theme="dark"] .seg{background:#141b38}
.seg button{flex:1;border:none;background:transparent;font-family:inherit;font-size:12px;font-weight:600;color:var(--muted);padding:7px 2px;border-radius:999px;cursor:pointer;white-space:nowrap}
.seg button.on{background:#fff;color:#3348c5;box-shadow:0 3px 10px rgba(51,72,197,.18);font-weight:800}
html[data-theme="dark"] .seg button.on{background:#232f5e;color:#c9d6ff}
.chart-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.chart-head .ct{font-size:15.5px;font-weight:700;display:flex;gap:8px;align-items:center}
.chart-head .ctot{font-size:13px;font-weight:800;color:#3348c5}
html[data-theme="dark"] .chart-head .ctot{color:#9db4ff}
svg text{font-family:inherit}
.legend{display:flex;gap:16px;justify-content:center;margin-top:2px;font-size:11.5px;color:var(--muted)}
.legend .li{display:inline-block;width:18px;height:3px;border-radius:2px;background:#4b66f4;vertical-align:middle;margin-right:5px}
</style>

<style id="donut-style">
.donutwrap{display:flex;align-items:center;gap:18px}
.donut-svg{flex:none}
.dlegend{flex:1}
.dlegend .dl-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.dlegend .dl-row:last-child{border-bottom:none}
.dlegend .dot{width:11px;height:11px;border-radius:50%;flex:none}

function t(k){const L=STR[DB.lang||"bn"]||STR.bn;const s=L[k]!==undefined?L[k]:STR.bn[k];return typeof s==="string"?s.replace(/\u09F3/g,curSym()):s;}
function catName(c){return (DB.lang==="en"&&EXCAT_EN[c])?EXCAT_EN[c]:c;}
function bizDisplay(){return (!DB.bizName||DB.bizName==="আমার ব্যবসা")?t("default_biz"):DB.bizName;}
function applyTheme(){
  const mode=DB.theme||"system"; let eff=mode;
  if(mode==="system"){eff="light"; try{if(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)eff="dark";}catch(e){}}
  document.documentElement.dataset.theme=eff;
}
try{if(window.matchMedia)window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{if((DB.theme||"system")==="system")applyTheme();});}catch(e){}
function applyLang(){
  const cs=document.getElementById("curStyle");if(cs)cs.textContent='header::after{content:"'+curSym()+'"}';
  document.documentElement.lang=(DB.lang==="en"?"en":"bn");
  const labels=[t("tab_home"),t("tab_msgs"),t("tab_sales"),t("tab_products"),t("tab_more")];
  document.querySelectorAll("#tabbar button").forEach((b,i)=>{if(b.lastChild)b.lastChild.textContent=labels[i];});
  try{const sg=document.querySelector(".slogan"); if(sg)sg.textContent=t("slogan");}catch(e){}
}
function setLang(v){DB.lang=v;save();render();}
function setCurrency(v){DB.currency=v;save();applyLang();}
function setTheme(v){DB.theme=v;save();applyTheme();render();}
function svgIcon(p,cls){return '<svg class="icn '+(cls||"")+'" viewBox="0 0 24 24">'+p+'</svg>';}

let chartRange="7d";
function setRange(r){chartRange=r;drawChart();}
function compactBn(v){v=Math.round(v);if(DB.lang==="en"){if(v===0)return "0";if(v>=100000)return Math.round(v/1000)+"k";if(v>=1000)return (v/1000).toFixed(v>=10000?0:1).replace(/\.0$/,"")+"k";return ""+v;}if(v===0)return "০";if(v>=100000){const x=v/100000;return bn(Number.isInteger(x)?x:x.toFixed(1))+" লাখ";}if(v>=1000){const x=v/1000;return bn(Number.isInteger(x)?x:x.toFixed(1))+" হাজার";}return bn(v);}
function dayTotal(ds){return DB.sales.filter(s=>s.date===ds).reduce((a,s)=>a+s.total,0);}
function chartData(){
  
  const pts=[];
  if(chartRange==="today"||chartRange==="yday"){
    const dt=chartRange==="today"?today():ydayStr();
    const endLbl=chartRange==="today"?t("c_now"):t("c_end");
    let run=0; pts.push({v:0,l:t("c_start")});
    DB.sales.filter(s=>s.date===dt).forEach(s=>{run+=s.total; pts.push({v:run,l:""});});
    if(pts.length>1)pts[pts.length-1].l=endLbl; else pts.push({v:0,l:endLbl});
    return pts;
  }
  if(chartRange==="7d"){
    for(let i=6;i>=0;i--){const d=new Date(); d.setDate(d.getDate()-i); pts.push({v:dayTotal(dstr(d)),l:t("wd")[d.getDay()]});}
    return pts;
  }
  if(chartRange==="1m"){
    for(let i=29;i>=0;i--){const d=new Date(); d.setDate(d.getDate()-i); pts.push({v:dayTotal(dstr(d)),l:i%5===0?bn(d.getDate()):""});}
    return pts;
  }
  const n = chartRange==="6m"?6:12;
  for(let i=n-1;i>=0;i--){const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()-i); const mk=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); const v=DB.sales.filter(s=>s.date.startsWith(mk)).reduce((a,s)=>a+s.total,0); pts.push({v:v,l:t("mshort")[d.getMonth()]});}
  return pts;
}
function drawChart(){
  const el=document.getElementById("chartCard"); if(!el)return;
  const R=[["today","r_today"],["yday","r_yday"],["7d","r_7d"],["1m","r_1m"]];
  const pts=chartData();
  const total=(chartRange==="today"||chartRange==="yday")?pts[pts.length-1].v:pts.reduce((a,p)=>a+p.v,0);
  const W=330,H=158,PL=6,PR=40,PT=12,PB=24,iw=W-PL-PR,ih=H-PT-PB;
  const mx=Math.max.apply(null,pts.map(p=>p.v).concat([1]));
  const X=i=>PL+iw*(pts.length===1?0.5:i/(pts.length-1));
  const Y=v=>PT+ih-(v/(mx*1.08))*ih;
  let path="";
  pts.forEach((p,i)=>{path+=(i===0?"M":"L")+X(i).toFixed(1)+","+Y(p.v).toFixed(1)+" ";});
  // smooth path (catmull-rom to bezier)
  let d="";
  for(let i=0;i<pts.length;i++){
    const p0=pts[Math.max(0,i-1)],p1=pts[i],p2=pts[Math.min(pts.length-1,i+1)],p3=pts[Math.min(pts.length-1,i+2)];
    if(i===0){d="M"+X(0)+","+Y(p1.v);}
    else{const c1x=X(i-1)+(X(i)-X(i-1))/6*( (Y(p2.v)-Y(p0.v))===0?0:1 )*0+ (X(i)-X(i-1))*0.0; d+=" C"+(X(i-1)+(X(i)-X(i-1))/3)+","+Y(p1.v-(p2.v-p0.v)/6*0)+" "+(X(i)-(X(i)-X(i-1))/3)+","+Y(p2.v)+" "+X(i)+","+Y(p2.v);}
  }
  // simpler smoothing: rebuild with standard formula
  d="M"+X(0)+","+Y(pts[0].v);
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[Math.max(0,i-1)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(pts.length-1,i+2)];
    const c1x=X(i)+(X(i+1)-X(i-1<0?0:i-1))/6, c1y=Y(p1.v)+(Y(p2.v)-Y(p0.v))/6;
    const c2x=X(i+1)-(X(Math.min(pts.length-1,i+2))-X(i))/6, c2y=Y(p2.v)-(Y(p3.v)-Y(p1.v))/6;
    d+=" C"+c1x.toFixed(1)+","+c1y.toFixed(1)+" "+c2x.toFixed(1)+","+c2y.toFixed(1)+" "+X(i+1).toFixed(1)+","+Y(p2.v).toFixed(1);
  }
  const area=d+" L"+X(pts.length-1)+","+(PT+ih)+" L"+X(0)+","+(PT+ih)+" Z";
  let grid="";
  for(let g=0;g<=3;g++){const v=mx*1.08*g/3; const y=PT+ih-(ih*g/3); grid+='<line x1="'+PL+'" y1="'+y+'" x2="'+(W-PR)+'" y2="'+y+'" stroke="var(--line)" stroke-width="1" stroke-dasharray="3 4"/><text x="'+(W-PR+6)+'" y="'+(y+4)+'" font-size="10" fill="var(--muted)">'+compactBn(v)+'</text>';}
  const li=pts.length-1;
  let dots="";
  pts.forEach((p,i)=>{ if(i===li) dots+='<circle cx="'+X(i)+'" cy="'+Y(p.v)+'" r="4.5" fill="var(--card)" stroke="#3348c5" stroke-width="2.5"/>'; });
  const vline='<line x1="'+X(li)+'" y1="'+Y(pts[li].v)+'" x2="'+X(li)+'" y2="'+(PT+ih)+'" stroke="#3348c5" stroke-width="1.2" stroke-dasharray="3 4" opacity=".6"/>';
  let xlabels="";
  pts.forEach((p,i)=>{ if(p.l) xlabels+='<text x="'+X(i)+'" y="'+(H-6)+'" font-size="10" fill="var(--muted)" text-anchor="middle">'+p.l+'</text>'; });
  const seg=R.map(r=>'<button class="'+(chartRange===r[0]?"on":"")+'" data-r="'+r[0]+'" onclick="event.stopPropagation();setRange(this.dataset.r)">'+t(r[1])+'</button>').join("");
  el.innerHTML='<div class="chart-head"><div class="ct">'+svgIcon(I.chart,"sm")+t("chart_title")+'</div><div class="ctot">'+money(total)+'</div></div>'
    +'<div class="seg">'+seg+'</div>'
    +'<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;display:block"><defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4b66f4" stop-opacity=".28"/><stop offset="1" stop-color="#82dfe4" stop-opacity=".02"/></linearGradient></defs>'
    +grid+'<path d="'+area+'" fill="url(#ag)"/><path d="'+d+'" fill="none" stroke="#4b66f4" stroke-width="2.5" stroke-linecap="round"/>'+vline+dots+xlabels+'</svg>'
    +'<div class="legend"><span><span class="li"></span>'+t("legend_sales")+'</span></div>';
  drawDonut();
}


function inRange(ds){
  if(chartRange==="today") return ds===today();
  if(chartRange==="yday") return ds===ydayStr();
  if(chartRange==="7d"||chartRange==="1m"){ const n=chartRange==="7d"?7:30; const d=new Date(); d.setDate(d.getDate()-(n-1)); return ds>=dstr(d)&&ds<=today(); }
  const n=chartRange==="6m"?6:12; const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()-(n-1)); const mk=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); return ds.slice(0,7)>=mk&&ds.slice(0,7)<=thisMonth();
}
function drawDonut(){
  const el=document.getElementById("donutCard"); if(!el)return;
  const sales=DB.sales.filter(s=>inRange(s.date)).reduce((a,s)=>a+s.total,0);
  const out=DB.purchases.filter(x=>inRange(x.date)).reduce((a,x)=>a+x.cost,0)+DB.expenses.filter(x=>inRange(x.date)).reduce((a,x)=>a+x.amount,0)+(DB.staffTx||[]).filter(x=>inRange(x.date)).reduce((a,x)=>a+x.amount,0);
  const profit=sales-out;
  const mx=Math.max(sales,out,1);
  function ring(r,frac,color){
    const c=2*Math.PI*r; const f=Math.max(0,Math.min(1,frac));
    return '<circle cx="65" cy="65" r="'+r+'" fill="none" stroke="var(--line)" stroke-width="10"/>'
      +'<circle cx="65" cy="65" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="10" stroke-linecap="round" stroke-dasharray="'+(c*f).toFixed(1)+' '+c.toFixed(1)+'" transform="rotate(-90 65 65)"/>';
  }
  el.innerHTML='<div class="chart-head"><div class="ct">'+svgIcon(I.chart,"sm")+t("donut_title")+'</div></div>'
    +'<div class="donutwrap"><svg class="donut-svg" viewBox="0 0 130 130" width="130" height="130">'
    +ring(54,sales/mx,"#4b66f4")+ring(41,out/mx,"#82dfe4")
    +'<text x="65" y="60" text-anchor="middle" font-size="11" fill="var(--muted)">'+t("d_profit")+'</text>'
    +'<text x="65" y="80" text-anchor="middle" font-size="15" font-weight="800" fill="'+(profit<0?"var(--red)":"var(--text)")+'">'+money(profit)+'</text></svg>'

function saveOrder(){
  const cust=gv("oCust").trim();
  if(!cust)return ferr(t("o_ecust"));
  const p=prod(gv("oProd"));
  const qty=num(gv("oQty"))||1;

  const desc=gv("oDesc")||(p?p.name:"");
  if(!desc)return ferr(t("e_desc"));
  if(price<=0)return ferr(t("e_price"));
  const vid=(p&&hasVar(p))?gv("oVar"):"";
  const vv=vid?varById(p,vid):null;
  if(p&&hasVar(p)&&!vv)return ferr(t("e_var"));

  DB.orders.push({id:uid(),no:no,date:today(),customer:cust,phone:gv("oPhone"),address:gv("oAddr"),src:gv("oSrc"),productId:p?p.id:"",desc:desc,qty:qty,total:Math.round(qty*price),status:"pending",variant:vv?vv.name:"",variantId:vid});

function saveComplete(id){
  const o=ordById(id); if(!o||o.status!=="pending")return;
  const p=o.productId?prod(o.productId):null;
  const cvv=(p&&o.variantId)?varById(p,o.variantId):null;
  if(p&&hasVar(p)&&o.variantId&&!cvv)return ferr(t("e_var"));
  if(cvv&&o.qty>cvv.qty)return ferr(t("e_stock1")+" "+bn(cvv.qty)+" "+t("e_stock2"));
  if(!cvv&&p&&o.qty>p.qty)return ferr(t("e_stock1")+" "+bn(p.qty)+" "+t("e_stock2"));
  const pay=gv("ocPay");
  const sale={id:uid(),date:today(),desc:o.desc,productId:p?p.id:"",qty:o.qty,total:o.total,cost:p?Math.round(p.buy*o.qty):0,pay:pay,walletId:pay==="baki"?"":wv("ocWallet"),customer:o.customer,phone:o.phone,orderId:o.id,variant:o.variant||"",variantId:o.variantId||""};
  DB.sales.push(sale);
  if(p)applyVar(p,o.variantId||"",-o.qty);
  o.status="done";
  save();closeSheet();render();
}
function retRefundCalc(o,rq){
  const left=o.qty-(o.returned||0);
  if(rq>=left)return o.total-(o.refunded||0);
  return Math.round(o.total/o.qty*rq);
}
function updRetRefund(id){
  const o=ordById(id); if(!o)return;
  const rq=num(gv("rQty"))||0;
  const el=document.getElementById("rRefund");
  if(el)el.textContent=money(retRefundCalc(o,Math.min(rq,o.qty-(o.returned||0))));
}
function openReturn(id){
  const o=ordById(id); if(!o||o.status!=="done")return;
  const left=o.qty-(o.returned||0);
  openSheet(sheetHead(t("o_return")+" — #"+bn(ordNo(o)))
    +'<div class="note" style="margin-bottom:10px">'+esc(o.desc)+'</div>'
    +'<div class="kv"><span>'+t("o_ret_ordered")+'</span><span>'+bn(o.qty)+'</span></div>'
    +'<div class="kv"><span>'+t("o_ret_already")+'</span><span>'+bn(o.returned||0)+'</span></div>'
    +'<div class="kv"><span>'+t("o_ret_left")+'</span><b>'+bn(left)+'</b></div>'
    +'<div class="f"><label>'+t("o_ret_qty")+'</label><input id="rQty" inputmode="decimal" value="'+bn(left)+'" oninput="updRetRefund(\''+id+'\')"></div>'
    +'<div class="kv"><span>'+t("o_ret_refund")+'</span><b id="rRefund">'+money(retRefundCalc(o,left))+'</b></div>'
    +'<div class="btnrow"><button class="btn" onclick="saveReturn(\''+id+'\')">'+t("o_return")+'</button><button class="btn ghost" onclick="closeSheet()">'+t("cancel")+'</button></div>');
}
function saveReturn(id){
  const o=ordById(id); if(!o||o.status!=="done")return;
  const left=o.qty-(o.returned||0);
  const rq=num(gv("rQty"));
  if(rq<=0||rq>left)return ferr(t("e_ret_qty"));
  const refund=retRefundCalc(o,rq);
  const pr=o.productId?prod(o.productId):null;
  if(pr)applyVar(pr,o.variantId||"",rq);
  const sale=DB.sales.find(s=>s.orderId===id);
  if(sale){sale.total-=refund; sale.qty-=rq; sale.cost=Math.max(0,(sale.cost||0)-(pr?Math.round(pr.buy*rq):0)); if(sale.qty<=0&&sale.total<=0)DB.sales=DB.sales.filter(s=>s.id!==sale.id);}
  o.returned=(o.returned||0)+rq;
  o.refunded=(o.refunded||0)+refund;
  save();closeSheet();render();
}

const KIND_COLORS={cash:["#0ea968","#0b7a55"],bkash:["#e2136e","#a30d50"],nagad:["#f97b1d","#dd5800"],rocket:["#9b3fa0","#6d1f74"],bank:["#3b6fe0","#2749a8"],other:["#64748b","#475569"]};
const KIND_ICONS={cash:"wallet",bkash:"phone",nagad:"phone",rocket:"phone",bank:"store",other:"wallet"};
const KIND_KEYS={cash:"k_cash",bkash:"k_bkash",nagad:"k_nagad",rocket:"k_rocket",bank:"k_bank",other:"k_other"};
function defaultWallets(){return [{id:uid(),name:"ক্যাশ",kind:"cash",opening:0,auto:true}];}
function fixSeedWallets(){
  const DEFN={cash:"ক্যাশ",bkash:"বিকাশ",nagad:"নগদ",bank:"ব্যাংক"};
  let marked=false;
  (DB.wallets||[]).forEach(w=>{if(w.auto===undefined&&DEFN[w.kind]===w.name){w.auto=true;marked=true;}});
  if(marked)save();
  const ws=DB.wallets||[];
  if(ws.length!==4)return;
  if(ws.map(w=>w.kind).sort().join(",")!=="bank,bkash,cash,nagad")return;
  if(!ws.every(w=>!w.opening))return;
  const cash=ws.find(w=>w.kind==="cash");
  const used=[].concat(DB.sales,DB.payments,DB.purchases,DB.expenses).some(x=>x.walletId&&x.walletId!==cash.id);
  if(used)return;
  DB.wallets=[cash];
  save();
}
function dispWName(w){return w.auto?t(KIND_KEYS[w.kind]||"k_other"):w.name;}
function walletById(id){return (DB.wallets||[]).find(w=>w.id===id);}
function defaultWalletId(kind){
  const ws=DB.wallets||[]; if(!ws.length)return "";
  if(kind==="mobile"){const m=ws.find(w=>["bkash","nagad","rocket"].indexOf(w.kind)>=0); if(m)return m.id;}
  const c=ws.find(w=>w.kind===(kind||"cash")); if(c)return c.id;
  return ws[0].id;
}
function flowWalletId(x){ if(x.walletId&&walletById(x.walletId))return x.walletId; return defaultWalletId("cash"); }
function walletBal(w){
  let b=+w.opening||0;
  DB.sales.forEach(s=>{if(s.pay!=="baki"&&flowWalletId(s)===w.id)b+=s.total;});
  (DB.payments||[]).forEach(pm=>{if(flowWalletId(pm)===w.id)b+=pm.amount;});
  DB.purchases.forEach(p=>{if(flowWalletId(p)===w.id)b-=p.cost;});
  DB.expenses.forEach(e=>{if(flowWalletId(e)===w.id)b-=e.amount;});
  (DB.staffTx||[]).forEach(x=>{if(flowWalletId(x)===w.id)b-=x.amount;});
  (DB.loans||[]).forEach(l=>{if(l.walletId===w.id)b+=l.direction==="borrow"?l.amount:-l.amount;});
  (DB.bankLoans||[]).forEach(l=>{if(l.walletId===w.id)b+=l.amount;});
  (DB.loanTx||[]).forEach(x=>{
    if(x.walletId!==w.id)return;
    const pl=(DB.loans||[]).find(l=>l.id===x.loanId);
    if(pl)b+=pl.direction==="borrow"?-x.amount:x.amount;
    else if((DB.bankLoans||[]).some(l=>l.id===x.loanId))b-=x.amount;
  });
  (DB.savTx||[]).forEach(x=>{if(x.walletId===w.id)b+=x.kind==="wd"?x.amount:-x.amount;});
  return b;
}
function walletOpts(selId){return (DB.wallets||[]).map(w=>'<option value="'+w.id+'"'+(w.id===selId?" selected":"")+'>'+esc(dispWName(w))+'</option>').join("");}

function repDates(){
  const td=today();
  const back=n=>{const d=new Date();d.setDate(d.getDate()-n);return dstr(d);};
  if(repRange==="today")return [td,td];
  if(repRange==="yday")return [back(1),back(1)];
  if(repRange==="week")return [back(6),td];
  if(repRange==="month"){const d=new Date();d.setDate(1);return [dstr(d),td];}
  if(repRange==="lastmonth"){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-1);const e=new Date(d.getFullYear(),d.getMonth()+1,0);return [dstr(d),dstr(e)];}
  return [repFrom||td,repTo||td];
}
function rangeStats(f,t2){
  const inR=d=>d>=f&&d<=t2;
  const sl=DB.sales.filter(x=>inR(x.date));
  const s=sl.reduce((a,x)=>a+x.total,0);
  const pu=DB.purchases.filter(x=>inR(x.date)).reduce((a,x)=>a+x.cost,0);
  const e=DB.expenses.filter(x=>inR(x.date)).reduce((a,x)=>a+x.amount,0)+(DB.staffTx||[]).filter(x=>inR(x.date)).reduce((a,x)=>a+x.amount,0);
  return {s:s,pu:pu,e:e,n:sl.length,p:s-pu-e};
}

function saveStaff(id){
  const name=gv("stName").trim();
  if(!name)return ferr(t("e_staff_name"));
  const salary=num(gv("stSalary"));
  if(salary<=0)return ferr(t("e_salary"));
  const data={name:name,role:gv("stRole"),phone:gv("stPhone"),salary:salary,joinDate:gv("stJoin")};
  if(id){Object.assign(staffById(id),data);}
  else DB.staff.push(Object.assign({id:uid()},data));

function saveLoan(id){
  const person=gv("lnPerson").trim();
  if(!person)return ferr(t("e_person"));
  const amt=num(gv("lnAmt"));
  if(amt<=0)return ferr(t("e_amt"));
  const iRate=num(gv("lnIntRate")),iAmt=num(gv("lnIntAmt"));
  const interest=iAmt>0?iAmt:Math.round(amt*iRate/100);
  if(!id&&loanSrcTab!=="person"){
    DB.bankLoans.push({id:uid(),src:loanSrcTab,name:person,amount:amt,installment:num(gv("lnInst")),rate:iRate,interest:interest,date:gv("lnDate")||today(),walletId:gv("lnWallet"),paid:0});
    save();closeSheet();openSub("loans");return;
  }
  const data={person:person,phone:gv("lnPhone"),direction:gv("lnDir"),amount:amt,rate:iRate,interest:interest,date:gv("lnDate")||today(),walletId:gv("lnWallet"),note:""};
  if(id){Object.assign(loanById(id),data);}
  else DB.loans.push(Object.assign({id:uid(),paid:0},data));
  save();closeSheet();openSub("loans");
}

    h+='<div class="card"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><b style="font-size:15.5px">'+esc(l.name)+'</b>'+(rem<=0?'<span class="chip">'+t("ln_settled")+'</span>':"")+'<span style="flex:1"></span><b style="font-size:16px;color:var(--red)">'+money(rem)+'</b></div>'
      +'<div class="kv"><span>'+t("bl_amount")+'</span><span>'+money(l.amount)+'</span></div>'
      +'<div class="kv"><span>'+t("ln_paid")+'</span><span>'+money(l.paid||0)+'</span></div>'
      +(l.installment>0?'<div class="kv"><span>'+t("bl_inst")+'</span><span>'+money(l.installment)+'</span></div>':"")
      +'<div class="btnrow">'
      +(rem>0?'<button class="btn small" onclick="openBankPay(\''+l.id+'\')">'+t("bl_pay")+'</button>':"")
      +'<button class="btn small ghost" onclick="openBankLoan(\''+l.id+'\')">'+svgIcon(I.edit,"sm")+t("btn_edit")+'</button>'
      +'<button class="btn small red" onclick="delBankLoan(\''+l.id+'\')">'+svgIcon(I.trash,"sm")+t("btn_del")+'</button></div>';
    if(pays.length)h+='<div style="border-top:1px solid var(--line);margin-top:10px;padding-top:8px">'+pays.map(x=>'<div class="kv"><span>'+t("bl_pay")+' \u00B7 '+fmtDate(x.date)+'</span><span>'+money(x.amount)+' <a href="javascript:void(0)" onclick="delLoanTx(\''+x.id+'\')" style="color:var(--red);text-decoration:none">\u2715</a></span></div>').join("")+'</div>';
    h+='</div>';
  });
  document.getElementById("page-bankloans").innerHTML=h;
}
function openBankLoan(id){
  const l=id?bankById(id):null;
  openSheet(sheetHead(l?t("bl_edit"):t("bl_new"))
    +'<div class="f"><label>'+t("bl_source")+'</label><input id="blName" value="'+(l?esc(l.name):"")+'" placeholder="'+t("bl_source")+'"></div>'
    +'<div class="f"><label>'+t("bl_amount")+'</label><input id="blAmt" inputmode="decimal" value="'+(l?bn(l.amount):"")+'" placeholder="0"></div>'
    +'<div class="f"><label>'+t("bl_inst")+'</label><input id="blInst" inputmode="decimal" value="'+(l&&l.installment?bn(l.installment):"")+'" placeholder="0"></div>'
    +'<div class="f"><label>'+t("in_rate")+'</label><input id="blIntRate" inputmode="decimal" value="'+(l&&l.rate?bn(l.rate):"")+'" placeholder="0"></div>'
    +'<div class="f"><label>'+t("in_amt")+'</label><input id="blIntAmt" inputmode="decimal" value="'+(l&&l.interest?bn(l.interest):"")+'" placeholder="0"></div>'
    +'<div class="note">'+t("in_hint")+'</div>'
    +'<div class="f"><label>'+t("f_date")+'</label><input id="blDate" type="date" value="'+(l?l.date:today())+'"></div>'
    +loanWalletField("blWallet",l?l.walletId:defaultWalletId("cash"))
    +'<div class="btnrow"><button class="btn" onclick="saveBankLoan(\''+(id||"")+'\')">'+t("save")+'</button><button class="btn ghost" onclick="closeSheet()">'+t("cancel")+'</button></div>');
}
function saveBankLoan(id){
  const name=gv("blName").trim();
  if(!name)return ferr(t("e_blname"));
  const amt=num(gv("blAmt"));
  if(amt<=0)return ferr(t("e_amt"));
  const bRate=num(gv("blIntRate")),bAmt=num(gv("blIntAmt"));
  const data={name:name,amount:amt,installment:num(gv("blInst")),rate:bRate,interest:bAmt>0?bAmt:Math.round(amt*bRate/100),date:gv("blDate")||today(),walletId:gv("blWallet")};
  if(id){Object.assign(bankById(id),data);}
  else DB.bankLoans.push(Object.assign({id:uid(),paid:0},data));
  save();closeSheet();openSub("loans");
}
function delBankLoan(id){if(!confirm(t("confirm_del")))return;DB.bankLoans=DB.bankLoans.filter(l=>l.id!==id);DB.loanTx=DB.loanTx.filter(x=>x.loanId!==id);save();openSub("loans");}
function openBankPay(id){
  const l=bankById(id); if(!l)return;
  const rem=bankRemain(l);
  const def=l.installment>0?Math.min(l.installment,rem):rem;
  openSheet(sheetHead(t("bl_pay")+" \u2014 "+esc(l.name))
    +'<div class="note" style="margin-bottom:10px">'+money(l.amount)+' \u00B7 '+t("ln_paid")+' '+money(l.paid||0)+' \u00B7 '+t("ln_remain")+' '+money(rem)+'</div>'
    +'<div class="f"><label>'+t("f_amt")+'</label><input id="bpAmt" inputmode="decimal" value="'+bn(def)+'"></div>'
    +'<div class="f"><label>'+t("f_date")+'</label><input id="bpDate" type="date" value="'+today()+'"></div>'
    +walletField("bpWallet","f_wallet_out","cash")
    +'<div class="btnrow"><button class="btn" onclick="saveBankPay(\''+id+'\')">'+t("save")+'</button><button class="btn ghost" onclick="closeSheet()">'+t("cancel")+'</button></div>');
}
function saveBankPay(id){
  const l=bankById(id); if(!l)return;
  const amt=num(gv("bpAmt"));
  if(amt<=0||amt>bankRemain(l))return ferr(t("e_amt"));
  l.paid=(l.paid||0)+amt;
  DB.loanTx.push({id:uid(),loanId:id,amount:amt,date:gv("bpDate")||today(),walletId:wv("bpWallet")});
  save();closeSheet();openSub("loans");
}
function delLoanTx(id){
  if(!confirm(t("confirm_del")))return;
  const x=(DB.loanTx||[]).find(t2=>t2.id===id); if(!x)return;
  const pl=loanById(x.loanId)||bankById(x.loanId);
  if(pl)pl.paid=Math.max(0,(pl.paid||0)-x.amount);
  DB.loanTx=DB.loanTx.filter(t2=>t2.id!==id);
  save();render();
}
function paidAmt(s){return (DB.payments||[]).filter(x=>x.saleId===s.id).reduce((a,x)=>a+x.amount,0);}
function dueRemain(s){return Math.max(0,s.total-paidAmt(s));}
function totalDue(){return DB.sales.filter(s=>s.pay==="baki").reduce((a,s)=>a+dueRemain(s),0);}
function renderDues(){
  let h='<button class="btn ghost small" onclick="closeSub()" style="margin-bottom:10px">\u2190 '+t("back")+'</button>';
  h+='<div class="totalbar"><div><div class="tl">'+t("due_total")+'</div><div class="tv">'+money(totalDue())+'</div></div>'+svgIcon(I.book)+'</div>';
  const list=DB.sales.filter(s=>s.pay==="baki");
  if(!list.length)h+='<div class="card"><div class="empty"><div class="eic">'+svgIcon(I.book)+'</div>'+t("due_empty")+'<br>'+t("due_empty_sub")+'</div></div>';
  const groups={};
  list.forEach(s=>{const k=(s.customer||s.desc||"").trim().toLowerCase();if(!groups[k])groups[k]={name:s.customer||s.desc,phone:s.phone||"",items:[]};groups[k].items.push(s);if(!groups[k].phone&&s.phone)groups[k].phone=s.phone;});
  Object.values(groups).forEach(g=>{
    const rem=g.items.reduce((a,s)=>a+dueRemain(s),0);
    h+='<div class="card"><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><b style="font-size:15.5px">'+esc(g.name)+'</b>'
      +(rem>0?'<span class="chip due">'+t("due_total")+' '+money(rem)+'</span>':'<span class="chip">'+t("ln_settled")+'</span>')
      +'<span style="flex:1"></span>'
      +(g.phone?'<a class="btn small ghost" href="tel:'+esc(g.phone.replace(/[^0-9+]/g,""))+'">'+svgIcon(I.phone,"sm")+t("btn_call")+'</a>':"")+'</div>';
    g.items.sort((a,b)=>a.date.localeCompare(b.date)).forEach(s=>{
      const r=dueRemain(s);
      h+='<div style="border-top:1px solid var(--line);margin-top:10px;padding-top:10px"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><b>'+esc(s.desc)+'</b><span class="s">'+fmtDate(s.date)+'</span><span style="flex:1"></span><b>'+money(s.total)+'</b></div>'
        +'<div class="s">'+t("due_collected")+' '+money(paidAmt(s))+' \u00B7 '+t("ln_remain")+' <b style="color:var(--red)">'+money(r)+'</b></div>'
        +(r>0?'<div class="btnrow"><button class="btn small" onclick="openPay(\''+s.id+'\')">'+t("due_collect")+'</button></div>':"")
        +'</div>';
    });
    h+='</div>';
  });
  document.getElementById("page-dues").innerHTML=h;
}
function openPay(sid){
  const s=DB.sales.find(x=>x.id===sid); if(!s)return;
  const r=dueRemain(s);
  openSheet(sheetHead(t("tx_collect")+" \u2014 "+esc(s.customer||s.desc))
    +'<div class="note" style="margin-bottom:10px">'+money(s.total)+' \u00B7 '+t("due_collected")+' '+money(paidAmt(s))+' \u00B7 '+t("ln_remain")+' '+money(r)+'</div>'
    +'<div class="f"><label>'+t("f_amt")+'</label><input id="dpAmt" inputmode="decimal" value="'+bn(r)+'"></div>'
    +'<div class="f"><label>'+t("f_date")+'</label><input id="dpDate" type="date" value="'+today()+'"></div>'
    +walletField("dpWallet","f_wallet_in","cash")
    +'<div class="btnrow"><button class="btn" onclick="savePay(\''+sid+'\')">'+t("save")+'</button><button class="btn ghost" onclick="closeSheet()">'+t("cancel")+'</button></div>');
}
function savePay(sid){
  const s=DB.sales.find(x=>x.id===sid); if(!s)return;
  const amt=num(gv("dpAmt"));
  if(amt<=0||amt>dueRemain(s))return ferr(t("e_amt"));
  if(!DB.payments)DB.payments=[];
  DB.payments.push({id:uid(),saleId:sid,amount:amt,date:gv("dpDate")||today(),walletId:wv("dpWallet")});
  save();closeSheet();openSub("dues");
}
function openProductDetail(id){
  const p=prod(id); if(!p)return;
  const meta=[p.cat?(esc(p.cat)+(p.sub?" › "+esc(p.sub):"")):"",esc(p.brand||""),esc(p.code||"")].filter(Boolean).join(" · ");
  let h=sheetHead(esc(p.name));
  if(p.img)h+='<img src="'+p.img+'" style="width:100%;max-height:220px;object-fit:cover;border-radius:14px;margin-bottom:10px">';
  if(meta)h+='<div class="note" style="margin-bottom:8px">'+meta+'</div>';
  h+='<div class="kv"><span>'+t("stock_w")+'</span><b>'+bn(p.qty)+' '+(p.unit||t("pcs"))+'</b></div>';
  if(hasVar(p)){
    const groups={};
    p.variants.forEach(v=>{const parts=v.name.split(" / ");const c=parts[0];const sz=parts.slice(1).join(" / ");if(!groups[c])groups[c]=[];groups[c].push({sz:sz,qty:v.qty});});
    h+='<div style="font-weight:700;margin:14px 0 8px">'+t("f_var_stock")+'</div>';
    Object.keys(groups).forEach(c=>{
      const tot=groups[c].reduce((a,x)=>a+x.qty,0);

      h+='<div style="background:rgba(120,130,180,.08);border-radius:12px;padding:10px 12px;margin-bottom:8px"><div style="display:flex;justify-content:space-between;align-items:center"><b>'+esc(c)+'</b><b>'+bn(tot)+' '+(p.unit||t("pcs"))+'</b></div>'
        +(showRows?groups[c].map(x=>'<div style="display:flex;justify-content:space-between;padding:5px 0 0"><span class="s" style="color:inherit">'+esc(x.sz||"—")+'</span><span>'+bn(x.qty)+'</span></div>').join(""):"")
        +'</div>';
    });
  }
  h+='<div style="display:flex;gap:8px;margin-top:12px;border-top:1px solid var(--line);padding-top:10px;text-align:center"><div style="flex:1"><div class="s">'+t("buy_price")+'</div><b>'+money(p.buy)+'</b></div><div style="flex:1"><div class="s">'+t("sell_price")+'</div><b>'+money(p.sell)+'</b></div><div style="flex:1"><div class="s">'+t("d_profit")+'</div><b style="color:#0b7a55">'+money((p.sell||0)-(p.buy||0))+'</b></div></div>'
    +'<div class="btnrow"><button class="btn small" onclick="closeSheet();openPurchase(\''+p.id+'\')">'+svgIcon(I.cart,"sm")+t("btn_buy")+'</button><button class="btn small ghost" onclick="closeSheet();openSale(\''+p.id+'\')">'+svgIcon(I.receipt,"sm")+t("btn_sell")+'</button><button class="btn small ghost" onclick="closeSheet();openProduct(\''+p.id+'\')">'+svgIcon(I.edit,"sm")+t("btn_edit")+'</button></div>';
  openSheet(h);
}

const wrap=document.getElementById("sheetWrap"),sheet=document.getElementById("sheet");
function openSheet(html){sheet.innerHTML=html;wrap.classList.add("open");}
function closeSheet(){wrap.classList.remove("open");}
wrap.addEventListener("click",e=>{if(e.target===wrap)closeSheet();});
function sheetHead(t){return '<h3>'+t+'</h3><div class="err" id="ferr"></div>';}
function ferr(m){document.getElementById("ferr").textContent=m;}
function gv(id){const el=document.getElementById(id);return el?el.value.trim():"";}
function openSale(preId){
  const opts=DB.products.map(p=>'<option value="'+p.id+'"'+(p.id===preId?" selected":"")+'>'+esc(p.name)+' ('+t("stock_w")+' '+bn(p.qty)+' '+(p.unit||t("pcs"))+')</option>').join("");
  openSheet(sheetHead(t("f_sale"))
    +'<div class="f"><label>'+t("f_product")+'</label><select id="sProd" onchange="saleProdChange()"><option value="">'+t("f_noproduct")+'</option>'+opts+'</select></div>'
    +'<div id="sVarBox"></div>'
    +'<div class="f"><label>'+t("f_desc")+'</label><input id="sDesc" placeholder="'+t("f_desc_ph")+'"></div>'
    +'<div class="f"><label>'+t("f_qty")+'</label><input id="sQty" inputmode="decimal" value="'+bn(1)+'"></div>'
    +'<div class="f"><label>'+t("f_price")+'</label><input id="sPrice" inputmode="decimal" placeholder="0"></div>'
    +'<div class="f"><label>'+t("f_payway")+'</label><select id="sPay" onchange="salePayChange()"><option value="cash">'+t("pay_cash")+'</option><option value="mobile">'+t("pay_mobile")+'</option><option value="baki">'+t("pay_baki")+'</option></select></div>'
    +'<div id="sBakiBox" style="display:none"><div class="f"><label>'+t("f_cname")+'</label><input id="sCust" placeholder="'+t("f_name_ph")+'"></div><div class="f"><label>'+t("f_phone2")+'</label><input id="sPhone" inputmode="tel" placeholder="01XXXXXXXXX"></div></div>'
    +'<div class="f" id="sWalletBox"><label>'+t("f_wallet")+'</label><select id="sWallet">'+walletOpts(defaultWalletId("cash"))+'</select></div>'
    
    +'<div class="btnrow"><button class="btn" onclick="saveSale()">'+t("save")+'</button><button class="btn ghost" onclick="closeSheet()">'+t("cancel")+'</button></div>');
  if(preId)saleProdChange();
}
function saleProdChange(){const p=prod(gv("sProd"));if(p){document.getElementById("sDesc").value=p.name;document.getElementById("sPrice").value=bn(p.sell);}const vb=document.getElementById("sVarBox");if(vb)vb.innerHTML=p?varField("sVar",p):"";}
function salePayChange(){const pay=gv("sPay");const sw=document.getElementById("sWallet");if(sw)sw.value=defaultWalletId(pay==="mobile"?"mobile":"cash");const wb=document.getElementById("sWalletBox");if(wb)wb.style.display=pay==="baki"?"none":"";const bb=document.getElementById("sBakiBox");if(bb)bb.style.display=pay==="baki"?"":"none";}
function saveSale(){
  const p=prod(gv("sProd"));const qty=num(gv("sQty"))||1;const price=num(gv("sPrice"));
  const desc=gv("sDesc")||(p?p.name:"");
  if(!desc)return ferr(t("e_desc"));
  if(price<=0)return ferr(t("e_price"));
  if(p&&qty>p.qty)return ferr(t("e_stock1")+" "+bn(p.qty)+" "+t("e_stock2"));
  const vid=(p&&hasVar(p))?gv("sVar"):"";
  const vv=vid?varById(p,vid):null;
  if(p&&hasVar(p)&&!vv)return ferr(t("e_var"));
  if(vv&&qty>vv.qty)return ferr(t("e_stock1")+" "+bn(vv.qty)+" "+t("e_stock2"));
  const pay=gv("sPay");const total=Math.round(qty*price);
  let cust="",ph="",wid=wv("sWallet");
  if(pay==="baki"){cust=gv("sCust").trim();ph=gv("sPhone");if(!cust)return ferr(t("o_ecust"));wid="";}
  const sale={id:uid(),date:today(),desc:desc,productId:p?p.id:"",qty:qty,total:total,cost:p?Math.round(p.buy*qty):0,pay:pay,walletId:wid,customer:cust,phone:ph,variant:vv?vv.name:"",variantId:vid};
  DB.sales.push(sale);
  if(p)applyVar(p,vid,-qty);
  save();closeSheet();tab="sales";salesView="shop";render();
}
let tmpProdImg="";
function prodImgPick(input){
  const f=input.files&&input.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{ const img=new Image(); img.onload=()=>{ const mx=512; const sc=Math.min(1,mx/Math.max(img.width,img.height)); const w=Math.max(1,Math.round(img.width*sc)),hh=Math.max(1,Math.round(img.height*sc)); const c=document.createElement("canvas"); c.width=w; c.height=hh; const x=c.getContext("2d"); x.fillStyle="#ffffff"; x.fillRect(0,0,w,hh); x.drawImage(img,0,0,w,hh); tmpProdImg=c.toDataURL("image/jpeg",0.85); const pv=document.getElementById("prImgPrev"); if(pv){pv.src=tmpProdImg; pv.style.display="";} const rm=document.getElementById("prImgRemove"); if(rm)rm.style.display=""; }; img.src=r.result; };
  r.readAsDataURL(f);
}
function prodImgClear(){ tmpProdImg=""; const pv=document.getElementById("prImgPrev"); if(pv){pv.removeAttribute("src"); pv.style.display="none";} const rm=document.getElementById("prImgRemove"); if(rm)rm.style.display="none"; }
function parseList(s){const out=[];(s||"").split(/[,\uFF0C]/).forEach(x=>{x=x.trim();if(x&&out.indexOf(x)<0)out.push(x);});return out;}
function comboNames(colors,sizes){
  if(colors.length&&sizes.length){const r=[];colors.forEach(c=>sizes.forEach(s=>r.push(c+" / "+s)));return r;}
  return colors.length?colors:sizes;
}
function hasVar(p){return !!(p&&p.variants&&p.variants.length);}
function varById(p,vid){return p&&p.variants?p.variants.find(v=>v.id===vid):null;}
function applyVar(p,vid,delta){
  if(hasVar(p)&&vid){const v=varById(p,vid);if(v){v.qty+=delta;p.qty=p.variants.reduce((a,x)=>a+x.qty,0);return;}}
  p.qty+=delta;
}
function varField(selId,p){
  if(!hasVar(p))return "";
  return '<div class="f"><label>'+t("f_variant")+'</label><select id="'+selId+'">'+p.variants.map(v=>'<option value="'+v.id+'">'+esc(v.name)+' ('+bn(v.qty)+')</option>').join("")+'</select></div>';
}
function varRowsInner(names,qmap){
  if(!names.length)return "";
  let rows="",lastColor=null;
  names.forEach(nm=>{
    const parts=nm.split(" / ");
    if(parts.length>1&&parts[0]!==lastColor){lastColor=parts[0];rows+='<div style="margin:12px 0 2px;font-weight:800;font-size:13.5px"><span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:'+colorDot(parts[0])+';border:1px solid rgba(0,0,0,.18);vertical-align:-1px;margin-right:6px"></span>'+esc(parts[0])+'</div>';}
    rows+='<div style="display:flex;align-items:center;gap:10px;margin-top:6px"><span style="flex:1">'+esc(parts.length>1?parts.slice(1).join(" / "):nm)+'</span><input data-vname="'+esc(nm)+'" inputmode="decimal" value="'+bn(qmap[nm]||0)+'" style="width:96px"></div>';
  });
  return '<div class="f"><label>'+t("f_var_stock")+'</label>'+rows+'</div>';
}
let tmpVarSrc=null;
function buildVarRows(){
  const box=document.getElementById("varRows"); if(!box)return;
  const qmap={};
  if(tmpVarSrc&&tmpVarSrc.variants)tmpVarSrc.variants.forEach(v=>{qmap[v.name]=v.qty;});
  box.querySelectorAll("input[data-vname]").forEach(inp=>{qmap[inp.getAttribute("data-vname")]=num(inp.value);});
  box.innerHTML=varRowsInner(comboNames(curColors,curSizes),qmap);
}
const COLOR_PALETTE=[["Black","#111111"],["White","#ffffff"],["Maroon","#7b1e26"],["Dark Maroon","#5e1220"],["Red","#dc2626"],["Pink","#ec4899"],["Light Pink","#f9a8d4"],["Peach","#ffb59a"],["Orange","#f97316"],["Yellow","#eab308"],["Golden","#d4a017"],["Cream","#f5eeda"],["Sand Beige","#d6bd93"],["Brown","#795548"],["Coffee","#4b2e2a"],["Olive","#808000"],["Green","#16a34a"],["Mint","#6ee7b7"],["Sky Blue","#38bdf8"],["Blue","#2563eb"],["Navy Blue","#1e3a8a"],["Purple","#7c3aed"],["Dark Purple","#4c1d95"],["Lavender","#c4b5fd"],["Grey","#6b7280"],["Ash","#9ca3af"],["Silver","#c0c0c0"]];
const SIZE_PRESETS=["S","M","L","XL","XXL","Free Size"];
let curColors=[],curSizes=[];
function colorDot(name){const f=COLOR_PALETTE.find(c=>c[0]===name);return f?f[1]:"#cbd5e1";}
function renderVarPickers(){
  const cs=document.getElementById("colSel"),cp=document.getElementById("colPal");
  if(cs)cs.innerHTML=curColors.map((c,i)=>'<span class="selchip"><span class="dot" style="background:'+colorDot(c)+'"></span>'+esc(c)+'<button type="button" onclick="removeColor('+i+')">\u00D7</button></span>').join("");
  if(cp)cp.innerHTML=COLOR_PALETTE.filter(c=>curColors.indexOf(c[0])<0).map(c=>'<button type="button" class="vchip" onclick="toggleColor(\''+c[0]+'\')"><span class="dot" style="background:'+c[1]+'"></span>'+c[0]+'</button>').join("");
  const ss=document.getElementById("sizeSel"),sp=document.getElementById("sizePal");
  if(ss)ss.innerHTML=curSizes.map((s,i)=>'<span class="selchip">'+esc(s)+'<button type="button" onclick="removeSize('+i+')">\u00D7</button></span>').join("");
  if(sp)sp.innerHTML=SIZE_PRESETS.filter(s=>curSizes.indexOf(s)<0).map(s=>'<button type="button" class="vchip" onclick="toggleSize(\''+s+'\')">'+s+'</button>').join("");
  buildVarRows();
}
function toggleColor(c){const i=curColors.indexOf(c);if(i>=0)curColors.splice(i,1);else curColors.push(c);renderVarPickers();}
function removeColor(i){curColors.splice(i,1);renderVarPickers();}
function toggleSize(s){const i=curSizes.indexOf(s);if(i>=0)curSizes.splice(i,1);else curSizes.push(s);renderVarPickers();}
function removeSize(i){curSizes.splice(i,1);renderVarPickers();}
function addCustomColor(){const v=gv("colCustom").trim();if(!v)return;if(curColors.indexOf(v)<0)curColors.push(v);document.getElementById("colCustom").value="";renderVarPickers();}
function addCustomSize(){const v=gv("sizeCustom").trim();if(!v)return;if(curSizes.indexOf(v)<0)curSizes.push(v);document.getElementById("sizeCustom").value="";renderVarPickers();}
function openProduct(id){
  const p=id?prod(id):null;

  curColors=parseList(p?p.colors||"":"");curSizes=parseList(p?p.sizes||"":"");
  const cats=[...new Set(DB.products.map(x=>x.cat).filter(Boolean))];
  const vq={}; if(p&&p.variants)p.variants.forEach(v=>{vq[v.name]=v.qty;});
  const vrows=varRowsInner(comboNames(parseList(p?p.colors||"":""),parseList(p?p.sizes||"":"")),vq);
  const subs=[...new Set(DB.products.map(x=>x.sub).filter(Boolean))];
  openSheet(sheetHead(p?t("f_prod_edit"):t("f_prod_new"))
    +'<div class="fsec">'+t("sec_basic")+'</div>'
    +'<div class="f"><label>'+t("f_photo")+'</label><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><img id="prImgPrev" src="'+(p&&p.img?p.img:"")+'" style="width:52px;height:52px;object-fit:cover;border-radius:12px;'+(p&&p.img?"":"display:none")+'"><label class="btn small ghost" style="margin:0;cursor:pointer">'+(p&&p.img?t("p_change"):t("p_add"))+'<input type="file" accept="image/*" style="display:none" onchange="prodImgPick(this)"></label><button type="button" class="btn small red" id="prImgRemove" style="'+(p&&p.img?"":"display:none")+'" onclick="prodImgClear()">'+t("p_remove")+'</button></div></div>'
    +'<div class="f"><label>'+t("f_prod_name")+'</label><input id="prName" value="'+(p?esc(p.name):"")+'" placeholder="'+t("f_prod_ph")+'"></div>'
    +'<div class="f"><label>'+t("f_cat")+'</label><input id="prCat" list="catList" value="'+(p?esc(p.cat||""):"")+'" placeholder="'+t("cat_ph")+'"><datalist id="catList">'+cats.map(c=>'<option value="'+esc(c)+'">').join("")+'</datalist></div>'
    +'<div class="f"><label>'+t("f_sub")+'</label><input id="prSub" list="subList" value="'+(p?esc(p.sub||""):"")+'" placeholder="'+t("sub_ph")+'"><datalist id="subList">'+subs.map(c=>'<option value="'+esc(c)+'">').join("")+'</datalist></div>'
    +'<div style="display:flex;gap:10px"><div class="f" style="flex:1"><label>'+t("f_brand")+'</label><input id="prBrand" value="'+(p?esc(p.brand||""):"")+'" placeholder="'+t("brand_ph")+'"></div><div class="f" style="flex:1"><label>'+t("f_code")+'</label><input id="prCode" value="'+(p?esc(p.code||""):"")+'" placeholder="'+t("code_ph")+'"></div></div>'
    +'<div class="f"><label>'+t("f_unit")+'</label><input id="prUnit" list="unitList" value="'+(p?esc(p.unit||""):"")+'" placeholder="'+t("unit_ph")+'"><datalist id="unitList">'+UNITS.map(u=>'<option value="'+u+'">').join("")+'</datalist></div>'
    +'<div class="fsec">'+t("sec_price")+'</div>'
    +'<div style="display:flex;gap:10px"><div class="f" style="flex:1"><label>'+t("f_buy")+'</label><input id="prBuy" inputmode="decimal" value="'+(p?bn(p.buy):"")+'" placeholder="0"></div><div class="f" style="flex:1"><label>'+t("f_sell")+'</label><input id="prSell" inputmode="decimal" value="'+(p?bn(p.sell):"")+'" placeholder="0"></div><div class="f" style="flex:1"><label>'+t("f_old")+'</label><input id="prOld" inputmode="decimal" value="'+(p&&p.old?bn(p.old):"")+'" placeholder="0"></div></div>'
    +'<div class="fsec">'+t("sec_variant")+'</div>'
    +'<div class="f"><label>'+t("f_colors")+'</label><div id="colSel" class="chiprow"></div><div id="colPal" class="chiprow"></div><div style="display:flex;gap:8px"><input id="colCustom" placeholder="'+t("col_custom_ph")+'" style="flex:1"><button type="button" class="btn small ghost" onclick="addCustomColor()">+ '+t("add_btn")+'</button></div></div>'
    +'<div class="f"><label>'+t("f_sizes")+'</label><div id="sizeSel" class="chiprow"></div><div id="sizePal" class="chiprow"></div><div style="display:flex;gap:8px"><input id="sizeCustom" placeholder="'+t("size_custom_ph")+'" style="flex:1"><button type="button" class="btn small ghost" onclick="addCustomSize()">+ '+t("add_btn")+'</button></div></div>'
    +'<div id="varRows">'+vrows+'</div>'
    +'<div class="fsec">'+t("sec_stock")+'</div>'
    +(p?"":'<div class="f"><label>'+t("f_open_stock")+'</label><input id="prQty" inputmode="decimal" value="'+bn(0)+'"></div>')
    +'<div class="f"><label>'+t("f_low_at")+'</label><input id="prLow" inputmode="decimal" value="'+(p?bn(p.low||5):bn(5))+'"></div>'
+'<div class="btnrow"><button class="btn" onclick="saveProduct(\''+(id||"")+'\')">'+t("save")+'</button><button class="btn ghost" onclick="closeSheet()">'+t("cancel")+'</button></div>');
  renderVarPickers();
}
function saveProduct(id){
  const name=gv("prName"),buy=num(gv("prBuy")),sell=num(gv("prSell")),low=num(gv("prLow"));
  if(!name)return ferr(t("e_pname"));
  if(sell<=0)return ferr(t("e_sell"));
  const colors=curColors.join(","),sizes=curSizes.join(",");
  const names=comboNames(parseList(colors),parseList(sizes));
  let variants=[],vtotal=0;
  if(names.length){
    const prev={};
    if(id){const op=prod(id);if(op&&op.variants)op.variants.forEach(v=>{prev[v.name]=v.id;});}
    const qmap={};
    document.querySelectorAll("input[data-vname]").forEach(inp=>{qmap[inp.getAttribute("data-vname")]=num(inp.value);});
    variants=names.map(nm=>{const q=qmap[nm]||0;vtotal+=q;return {id:prev[nm]||uid(),name:nm,qty:q};});
  }
  const extra={cat:gv("prCat").trim(),sub:gv("prSub").trim(),code:gv("prCode").trim(),brand:gv("prBrand").trim(),unit:gv("prUnit").trim(),old:num(gv("prOld")),img:tmpProdImg||"",colors:colors,sizes:sizes,variants:variants};
  if(id){const p=prod(id);Object.assign(p,{name:name,buy:buy,sell:sell,low:low||5},extra);if(names.length)p.qty=vtotal;}
  else{const np=Object.assign({id:uid(),name:name,buy:buy,sell:sell,qty:num(gv("prQty")),low:low||5},extra);if(names.length)np.qty=vtotal;DB.products.push(np);}
  save();closeSheet();tab="products";render();
}
function delProduct(id){if(!confirm(t("confirm_del")))return;DB.products=DB.products.filter(p=>p.id!==id);save();render();}
function openPurchase(id){
  const p=prod(id);if(!p)return;
  openSheet(sheetHead(t("f_pur")+" — "+esc(p.name))
    +varField("puVar",p)
    +'<div class="f"><label>'+t("f_pur_qty")+'</label><input id="puQty" inputmode="decimal" value="'+bn(1)+'"></div>'
    +'<div class="f"><label>'+t("f_pur_cost")+'</label><input id="puCost" inputmode="decimal" value="'+bn(p.buy)+'"></div>'
    +walletField("puWallet","f_wallet_out","cash")
    +'<div class="btnrow"><button class="btn" onclick="savePurchase(\''+id+'\')">'+t("save")+'</button><button class="btn ghost" onclick="closeSheet()">'+t("cancel")+'</button></div>');
}
function savePurchase(id){
  const p=prod(id);const qty=num(gv("puQty")),cost=num(gv("puCost"));
  if(qty<=0)return ferr(t("e_amt"));
  if(cost<=0)return ferr(t("e_buy"));
  const puVid=hasVar(p)?gv("puVar"):"";
  const puV=puVid?varById(p,puVid):null;
  applyVar(p,puVid,qty);p.buy=cost;
  DB.purchases.push({id:uid(),date:today(),productId:id,name:p.name,qty:qty,cost:Math.round(qty*cost),walletId:wv("puWallet"),variant:puV?puV.name:""});
  save();closeSheet();tab="products";render();
}
function openExpense(){
  const opts=EXCATS.map(c=>'<option value="'+c+'">'+esc(catName(c))+'</option>').join("");
  openSheet(sheetHead(t("f_exp"))
    +'<div class="f"><label>'+t("f_exp_cat")+'</label><select id="eCat">'+opts+'</select></div>'
    +'<div class="f"><label>'+t("f_exp_desc")+'</label><input id="eDesc" placeholder="'+t("f_exp_ph")+'"></div>'
    +'<div class="f"><label>'+t("f_amt")+'</label><input id="eAmt" inputmode="decimal" placeholder="0"></div>'
    +walletField("eWallet","f_wallet_out","cash")
    +'<div class="btnrow"><button class="btn" onclick="saveExpense()">'+t("save")+'</button><button class="btn ghost" onclick="closeSheet()">'+t("cancel")+'</button></div>');
}
function saveExpense(){
  const amt=num(gv("eAmt"));
  if(amt<=0)return ferr(t("e_exp_amt"));
  DB.expenses.push({id:uid(),date:today(),cat:gv("eCat"),desc:gv("eDesc"),amount:amt,walletId:wv("eWallet")});
  save();closeSheet();render();
}
let tmpBizLogo="";
function detectLogoDark(uri,cb){
  try{
    const img=new Image();
    img.onload=function(){
      try{
        const S=48,c=document.createElement("canvas"); c.width=S; c.height=S;
        const x=c.getContext("2d"); x.drawImage(img,0,0,S,S);
        const d=x.getImageData(0,0,S,S).data; let lum=0,n=0;
        for(let i=0;i<d.length;i+=4){const a=d[i+3]; if(a>40){const w=a/255; lum+=(0.2126*d[i]+0.7152*d[i+1]+0.0722*d[i+2])*w; n+=w;}}
        cb(n>0&&(lum/Math.max(n,1))<115);
      }catch(e){cb(false);}
    };
    img.onerror=function(){cb(false);};
    img.src=uri;
  }catch(e){cb(false);}
}
function bizLogoPick(input){
  const f=input.files&&input.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{ const img=new Image(); img.onload=()=>{ const mx=256; const sc=Math.min(1,mx/Math.max(img.width,img.height)); const w=Math.max(1,Math.round(img.width*sc)),hh=Math.max(1,Math.round(img.height*sc)); const c=document.createElement("canvas"); c.width=w; c.height=hh; c.getContext("2d").drawImage(img,0,0,w,hh); tmpBizLogo=c.toDataURL("image/png"); detectLogoDark(tmpBizLogo,function(dk){const pv2=document.getElementById("bizLogoPrev"); if(pv2)pv2.classList.toggle("bizlogo-w",dk);}); const pv=document.getElementById("bizLogoPrev"); if(pv){pv.src=tmpBizLogo; pv.style.display="";} const rm=document.getElementById("bizLogoRemove"); if(rm)rm.style.display=""; }; img.src=r.result; };
  r.readAsDataURL(f);
}
function bizLogoClear(){ tmpBizLogo=""; const pv=document.getElementById("bizLogoPrev"); if(pv){pv.removeAttribute("src"); pv.style.display="none";} const rm=document.getElementById("bizLogoRemove"); if(rm)rm.style.display="none"; }
function openBiz(){
  tmpBizLogo=DB.bizLogo||"";
  openSheet(sheetHead(t("f_biz"))
    +'<div class="f"><label>'+t("f_name")+'</label><input id="bName" value="'+esc(DB.bizName==="আমার ব্যবসা"?"":(DB.bizName||""))+'"></div>'
    +'<div class="f"><label>'+t("f_logo")+'</label><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><img id="bizLogoPrev" class="'+(DB.bizLogoDark?"bizlogo-w":"")+'" src="'+(DB.bizLogo||"")+'" style="height:44px;width:auto;max-width:130px;object-fit:contain;border-radius:9px;'+(DB.bizLogo?"":"display:none")+'"><label class="btn small ghost" style="margin:0;cursor:pointer">'+(DB.bizLogo?t("logo_change"):t("logo_add"))+'<input type="file" accept="image/*" style="display:none" onchange="bizLogoPick(this)"></label><button type="button" class="btn small red" id="bizLogoRemove" style="'+(DB.bizLogo?"":"display:none")+'" onclick="bizLogoClear()">'+t("logo_remove")+'</button></div><div class="note" style="margin-top:6px">'+t("logo_hint")+'</div></div>'
    +'<div class="btnrow"><button class="btn" onclick="saveBiz()">'+t("save")+'</button><button class="btn ghost" onclick="closeSheet()">'+t("cancel")+'</button></div>');
}
function saveBiz(){DB.bizName=gv("bName");DB.bizLogo=tmpBizLogo||"";if(DB.bizLogo){detectLogoDark(DB.bizLogo,function(dk){DB.bizLogoDark=dk;save();render();});}else{DB.bizLogoDark=false;}save();closeSheet();render();}
function doBackup(){
  const blob=new Blob([JSON.stringify(DB,null,1)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="rojgar-backup-"+today()+".json";document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
document.getElementById("restoreFile").addEventListener("change",function(){
  const f=this.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);DB=Object.assign(blank(),d);save();render();alert(t("restore_ok"));}catch(e){alert(t("restore_fail"));}};
  r.readAsText(f);this.value="";
});
applyTheme();
render();
